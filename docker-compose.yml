name: corruption

x-app: &app
  # Only `migrate` below carries the build; everyone else reuses the finished tag.
  # Four services exporting the same tag in parallel breaks the build.
  image: corruption-app:latest
  pull_policy: never
  env_file: .env
  environment:
    TZ: ${TZ:-Asia/Tashkent}
  restart: unless-stopped
  networks: [corruption_net]
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: corruption_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corruption}
      POSTGRES_USER: ${POSTGRES_USER:-corruption}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published: nothing outside this stack needs Postgres.
    # For a one-off psql session use `docker compose exec postgres psql -U corruption`.
    # If you really need it from the host, pick a free port (5432/5436 rules on this server):
    # ports:
    #   - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [corruption_net]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: corruption_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - redis_data:/data
    # Not published — host 6379 already belongs to the other project's redis_cache.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [corruption_net]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 320M

  # Runs once per `up`, applies migrations, exits. Everything else waits for it.
  migrate:
    <<: *app
    container_name: corruption_migrate
    # the single build of the image shared by every app service
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  client-bot:
    <<: *app
    container_name: corruption_client_bot
    command: ["python", "-m", "client_bot.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384M

  admin-bot:
    <<: *app
    container_name: corruption_admin_bot
    command: ["python", "-m", "admin_bot.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384M

  worker:
    <<: *app
    container_name: corruption_worker
    command:
      - celery
      - -A
      - admin_bot.worker
      - worker
      - --loglevel=info
      - --concurrency=2
      - --max-tasks-per-child=100
      - --without-gossip
      - --without-mingle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A admin_bot.worker inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:

networks:
  corruption_net:
    driver: bridge
